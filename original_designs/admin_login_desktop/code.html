<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Admin Login | Academy BD</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom focused border for inputs based on design system */
        .academic-input:focus {
            border-bottom-width: 2px;
            outline: none;
        }
        /* Subtle pattern background for institutional feel */
        .bg-pattern {
            background-color: #f8faf3;
            background-image: radial-gradient(#004317 0.5px, transparent 0.5px), radial-gradient(#004317 0.5px, #f8faf3 0.5px);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            opacity: 0.03;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-fixed": "#3e0117",
                        "inverse-primary": "#93d697",
                        "secondary-container": "#feb234",
                        "inverse-surface": "#2e312d",
                        "on-surface-variant": "#40493f",
                        "on-primary-fixed-variant": "#0c5221",
                        "surface-dim": "#d8dbd4",
                        "error-container": "#ffdad6",

                        "surface-container-high": "#e6e9e2",
                        "surface-container-highest": "#e0e3dc",
                        "tertiary": "#662035",
                        "on-secondary-container": "#6d4700",
                        "tertiary-fixed-dim": "#ffb1c1",
                        "primary-fixed-dim": "#93d697",
                        "surface": "#f8faf3",
                        "outline": "#717a6f",
                        "primary-container": "#1a5c2a",
                        "inverse-on-surface": "#eff2ea",
                        "surface-container": "#ecefe7",
                        "tertiary-container": "#83374b",
                        "on-error": "#ffffff",
                        "background": "#f8faf3",
                        "on-secondary-fixed-variant": "#624000",
                        "on-background": "#191d18",
                        "secondary": "#815500",
                        "on-tertiary-fixed-variant": "#772e42",
                        "on-tertiary": "#ffffff",
                        "surface-tint": "#2a6b37",
                        "tertiary-fixed": "#ffd9df",
                        "on-primary-fixed": "#002108",
                        "error": "#ba1a1a",
                        "on-primary": "#ffffff",
                        "surface-variant": "#e0e3dc",
                        "primary": "#004317",
                        "outline-variant": "#c0c9bc",
                        "on-secondary": "#ffffff",
                        "surface-bright": "#f8faf3",
                        "surface-container-low": "#f2f5ed",
                        "on-tertiary-container": "#ffacbd",
                        "surface-container-lowest": "#ffffff",
                        "secondary-fixed-dim": "#ffb94c",
                        "on-surface": "#191d18"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-mobile": "16px",
                        "gutter": "24px",
                        "base": "8px",
                        "margin-desktop": "auto",
                        "md": "24px",
                        "xs": "4px",
                        "lg": "48px",
                        "max-width": "1200px",
                        "sm": "12px",
                        "xl": "80px"
                    },
                    "fontFamily": {
                        "label-md": ["Noto Sans"],
                        "headline-lg": ["Noto Sans"],

                    "fontSize": {

                        "headline-md": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}]

                },
            },
        }

<body class="bg-background min-h-screen flex items-center justify-center p-margin-mobile relative overflow-hidden">
<!-- Background Motif Pattern -->
<div class="absolute inset-0 bg-pattern pointer-events-none"></div>
<!-- Centered Login Card -->
<main class="w-full max-w-[420px] relative z-10">
<div class="bg-surface-container-lowest border border-outline-variant rounded-lg shadow-sm overflow-hidden flex flex-col">
<!-- Academic Category Header Stripe -->
<div class="h-1 bg-primary w-full"></div>
<div class="px-md pt-xl pb-lg flex flex-col items-center text-center">
<!-- School Logo -->
<div class="mb-md">
<img alt="Academy BD Logo" class="w-20 h-20 rounded-full border-2 border-surface-variant p-1 object-contain" data-alt="A professional and minimalist school emblem logo featuring a stylized open book and a rising sun in deep green and white. The design is centered and circular, reflecting academic excellence and national pride within a modern corporate aesthetic. Soft studio lighting highlights the clean vector lines of the institutional brand identity." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBVpcJozd4G4WSwsncoBbTWqqe-ov9GtKPb8s3YEclrIsyLtq8VF91RVZzz5r3he9_E4GnHFBD52eHt9cm_hoyBH71PUwIW9iaAVL2vR-Qyl38zXYpWPYGLWcLZ7YMdRXk6UMjXqDPxQiw36gdoBeIBIpA8-IrT9F0UrqKdPHnMD_bQbKpmJRQAklKHYUyI7ros6crvgpX7XB0ZwPywJL2MhBVNuSWzjP6oEOL9ORDgdVrKpoCuXCvTDN8T_Ie2iFQQg6ZxqLj-d9TQ"/>
</div>
<h1 class="font-headline-md text-headline-md text-primary mb-1">Academy BD</h1>
<p class="font-body-md text-body-md text-on-surface-variant mb-xl">অ্যাডমিন লগইন / Admin Login</p>
<!-- Login Form -->
<form class="w-full space-y-md">
<!-- Username Field -->
<div class="text-left">
<label class="font-label-md text-label-md text-on-surface mb-2 block" for="username">
                            ইউজারনেম / Username
                        </label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]" data-icon="person">person</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface-container-low border-b-2 border-outline-variant text-on-surface font-body-md text-body-md placeholder-on-surface-variant/50 academic-input focus:border-primary transition-all rounded-t-sm" id="username" placeholder="Enter username" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="text-left">
<label class="font-label-md text-label-md text-on-surface mb-2 block" for="password">
                            পাসওয়ার্ড / Password
                        </label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]" data-icon="lock">lock</span>
<input class="w-full pl-10 pr-12 py-3 bg-surface-container-low border-b-2 border-outline-variant text-on-surface font-body-md text-body-md placeholder-on-surface-variant/50 academic-input focus:border-primary transition-all rounded-t-sm" id="password" placeholder="Enter password" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Options -->
<div class="flex items-center justify-between font-label-md text-label-md">
<label class="flex items-center text-on-surface-variant cursor-pointer group">
<input class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary mr-2 transition-all" type="checkbox"/>
                            মনে রাখুন / Remember me
                        </label>
<a class="text-primary hover:underline transition-all" href="#">পাসওয়ার্ড ভুলে গেছেন? / Forgot Password?</a>
</div>
<!-- Login Button -->
<button class="w-full bg-primary text-on-primary py-3 px-md rounded-lg font-label-md text-label-md shadow-sm hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2 mt-lg" type="submit">
                        লগইন করুন / Login 
                        <span class="material-symbols-outlined text-[18px]" data-icon="login">login</span>
</button>
</form>
</div>
<!-- Card Footer -->
<div class="bg-surface-container-high py-4 px-md border-t border-outline-variant flex justify-center items-center gap-4">
<a class="font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors flex items-center gap-1" href="/">
<span class="material-symbols-outlined text-[16px]" data-icon="arrow_back">arrow_back</span>
                    Back to Home
                </a>
<span class="text-outline-variant">|</span>
<a class="font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors" href="#">Support</a>
</div>
</div>
<!-- Institutional Trust Badge (Optional but adds to the theme) -->
<div class="mt-md flex justify-center items-center gap-2 opacity-60 grayscale hover:grayscale-0 transition-all cursor-default">
<span class="material-symbols-outlined text-on-surface-variant text-[16px]" data-icon="verified_user" style="font-variation-settings: 'FILL' 1;">verified_user</span>
<span class="font-label-md text-label-md text-on-surface-variant">Secure Academic Portal</span>
</div>
</main>
<!-- Corner Decorative Elements (Jamdani inspired) -->
<div class="fixed top-0 left-0 w-24 h-24 pointer-events-none opacity-20">
<div class="absolute inset-0 border-t-8 border-l-8 border-secondary rounded-tl-xl"></div>
</div>
<div class="fixed bottom-0 right-0 w-24 h-24 pointer-events-none opacity-20">
<div class="absolute inset-0 border-b-8 border-r-8 border-primary rounded-br-xl"></div>
</div>
</body></html>
